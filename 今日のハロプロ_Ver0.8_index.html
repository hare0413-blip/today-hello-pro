<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日のハロプロ Ver.0.8</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#6dbbff,#ff9ad1);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
.card{width:min(92%,430px);background:rgba(255,255,255,.18);backdrop-filter:blur(14px);border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.small{opacity:.9;font-size:.9rem}.group{font-size:2rem;font-weight:700;margin:.4em 0}
button{width:100%;padding:14px;border:none;border-radius:14px;background:#fff;color:#ff4aa0;font-weight:700}
.badge{display:inline-block;margin-top:18px;padding:6px 12px;border-radius:999px;font-weight:bold}
.song{background:rgba(255,255,255,.14);padding:10px 14px;border-radius:12px;margin:8px 0}
</style>
</head>
<body><div class="card">
<div class="small">🎧 MUSIC FOR TODAY</div>
<h1>今日のハロプロ</h1>
<p id="greet"></p>
<p class="small">毎日の「何聴こう？」を、もっと楽しく。</p>
<button onclick="pick()">今日の曲を選ぶ</button>
<div id="badge" class="badge"></div>
<div id="group" class="group">ボタンを押してスタート！</div>
<div id="songs"></div>
</div>
<script>
const items=[
{w:20,b:"🎵 TODAY'S GROUP",n:"Juice=Juice",bg:"#d93030",fg:"#fff",s:["クラクラ クライマックス","微炭酸","Fiesta! Fiesta!","プラトニック・プラネット","五月雨美女がさ乱れる"]},
{w:20,b:"🎵 TODAY'S GROUP",n:"モーニング娘。",bg:"#d4af37",fg:"#333",s:["恋愛レボリューション21","泡沫サタデーナイト！","I WISH"]},
{w:20,b:"🎵 TODAY'S GROUP",n:"アンジュルム",bg:"#2b74ff",fg:"#fff",s:["大器晩成","46億年LOVE","愛すべきべき Human Life"]},
{w:20,b:"🎵 TODAY'S GROUP",n:"BEYOOOOONDS",bg:"#fff2f7",fg:"#444",s:["眼鏡の男の子","ニッポンノD・N・A!","英雄〜笑って!ショパン先輩〜"]},
{w:20,b:"🎵 TODAY'S GROUP",n:"つばきファクトリー",bg:"#ff5ea8",fg:"#fff",s:["初恋サンライズ","低温火傷","今夜だけ浮かれたかった"]},
{w:20,b:"🎵 TODAY'S GROUP",n:"OCHA NORMA",bg:"#2ea84a",fg:"#fff",s:["恋のクラウチングスタート","ちはやぶる","運命 CHACHACHACHA〜N"]},
{w:20,b:"🎵 TODAY'S GROUP",n:"ロージークロニクル",bg:"#ffd94a",fg:"#333",s:["デビュー準備中","Coming Soon"]},
{w:3,b:"🌟 LEGEND PICK",n:"℃-ute",bg:"#666",fg:"#fff",s:["Danceでバコーン！","都会っ子 純情"]},
{w:3,b:"🌟 LEGEND PICK",n:"Berryz工房",bg:"#666",fg:"#fff",s:["付き合ってるのに片思い","スッペシャル ジェネレ〜ション"]},
{w:3,b:"🌟 LEGEND PICK",n:"こぶしファクトリー",bg:"#666",fg:"#fff",s:["念には念","桜ナイトフィーバー"]},
{w:3,b:"🎀 SPECIAL PROJECT",n:"SPECIAL PROJECTS",bg:"#8b5cf6",fg:"#fff",s:["恋愛♥ライダー（Buono!）","SHALL WE LOVE?（ごまっとう）","BE ALL RIGHT!（11WATER）","Missラブ探偵（W）","幸せビーム！好き好きビーム！（ハッピー7）"]}
];
greet.textContent=(new Date().getHours()<11?"おはよう☀️":new Date().getHours()<18?"こんにちは🌸":"こんばんは🌙");
function pick(){
 let t=items.reduce((a,v)=>a+v.w,0),r=Math.random()*t,p;
 for(const i of items){if((r-=i.w)<0){p=i;break}}
 badge.textContent=p.b;badge.style.background=p.bg;badge.style.color=p.fg;
 group.textContent=p.n;group.style.color=p.bg;
 songs.innerHTML=[...p.s].sort(()=>Math.random()-.5).map(x=>`<div class="song">🎧 ${x}</div>`).join("");
}
</script></body></html>
